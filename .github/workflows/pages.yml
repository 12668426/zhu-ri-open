name: Deploy interactive wallpaper demo

on:
  push:
    branches: ["主要的"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages-status:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Verify temporary browser preview
        shell: bash
        run: |
          base="https://raw.githack.com/12668426/zhu-ri-open/%E4%B8%BB%E8%A6%81%E7%9A%84"
          for part in index.html src/app.js src/style.css src/adaptive.css; do
            status=$(curl --location --silent --show-error --output "$RUNNER_TEMP/preview-test" --write-out '%{http_code}' "$base/$part" || true)
            echo "preview /$part: HTTP $status ($(wc -c < "$RUNNER_TEMP/preview-test") bytes)"
          done
      - name: Check whether Pages is enabled
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [[ "$code" == "200" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Pages is not enabled yet. The live site will deploy automatically after Settings → Pages is enabled (Source: GitHub Actions) and this workflow is rerun."
          fi

  deploy:
    needs: pages-status
    if: needs.pages-status.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare static website
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest sw.js .nojekyll dist/
          cp -R src assets dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload demo files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publish online demo
        id: deployment
        uses: actions/deploy-pages@v4
