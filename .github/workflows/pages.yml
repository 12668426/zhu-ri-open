name: Deploy interactive wallpaper demo

on:
  push:
    branches: ["主要的"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare static website
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest sw.js .nojekyll dist/
          cp -R src assets dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload demo files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publish online demo
        id: deployment
        uses: actions/deploy-pages@v4
