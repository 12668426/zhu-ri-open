<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="逐日：本地优先的桌面计划时间管理工具。自定义日程、倒计时和计划进度，支持 Plash。">
  <title>逐日 ZhuRi · 桌面计划时间管理</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./src/style.css">
  <link rel="stylesheet" href="./src/adaptive.css">
  <script src="./src/app.js" defer></script>
</head>
<body>
<main id="desk">
  <div id="workspace" class="workspace">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="30" cy="16" r="8" fill="#fac88c"/><path d="M9 29h30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M9 38c7-1 12-5 18-5h12" fill="none" stroke="#a9e1d1" stroke-width="3.5" stroke-linecap="round"/></svg></span><span><strong>逐日</strong><small>ZHURI · DESKTOP PLANNER</small></span></div>
      <span id="todayText" class="header-date"></span>
    </header>
    <div class="layout">
      <section class="overview" aria-label="当前时间与计划">
        <div class="clockbox"><div id="greeting" class="greeting">在自己的节奏里前进</div><div class="clock"><span id="timeNow">--:--</span><small id="seconds">--</small></div><div id="fullDate" class="full-date"></div></div>
        <article class="now-card" id="nowCard" data-urgency="normal">
          <div class="eyebrow"><i class="dot"></i><span id="activeStatus">正在进行</span></div>
          <h2 id="activeTitle">正在读取计划…</h2><div class="range" id="activeRange"></div>
          <div class="timer-grid"><div><span class="caption">剩余时间</span><div id="countdown" class="countdown">--:--</div></div><div class="timer-end"><span>结束于</span><strong id="endTime">--:--</strong></div></div>
          <div class="bar-copy"><span id="elapsed">时段进度</span><span id="percent">0%</span></div><div class="bar"><i id="elapsedBar"></i></div>
          <div class="next"><span>接下来</span><strong id="nextTitle">暂无安排</strong></div>
        </article>
        <div class="overview-heading"><strong>计划进度</strong><button type="button" id="allProjects" class="text-button">查看全部 →</button></div>
        <div id="projectsPreview" class="projects-preview"></div>
      </section>
      <section class="panel" id="panel" aria-label="计划管理卡片"><div class="panel-heading" id="panelHeading"></div><div class="panel-scroll" id="panelContent"></div><div class="panel-footer" id="panelFooter">所有数据保存在当前浏览器中 · 无需账号</div></section>
    </div>
    <footer class="desk-footer"><span>逐日 · 本地优先的桌面时间管理</span><span>今天的每一步，都算数</span></footer>
  </div>
  <button id="resizer" type="button" role="slider" aria-label="调节右侧桌面留白宽度" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="65" aria-valuenow="29" title="" tabindex="0"><span></span></button>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input id="importPicker" type="file" hidden accept="application/json,.json">
</body>
</html>
